name: Run Postman Tests and Publish HTML Report

 # Триггер: запускать workflow при пуше в ветку develop
on:
  push:
    branches:
      - develop

jobs:
  postman-tests-html:
    #  Указываем, что job должен запускаться на последней Ubuntu
    runs-on: ubuntu-latest

    steps:
      #  Клонирование репозитория в виртуальное окружение
      - name: Checkout repository
        uses: actions/checkout@v3

      #  Установка Node.js версии 18 
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      #  Установка зависимостей newman и html-репортера
      - name: Install dependencies
        run: |
          npm install newman newman-reporter-htmlextra --legacy-peer-deps

      #  Запуск Postman коллекции с HTML-отчётом
      # `if: always()` гарантирует, что шаг выполнится даже если предыдущий упал
      - name: Run Postman Collection with HTML Reporter
        if: always()
        run: |
          npx newman run "collections/Kampus_Smoke_User.postman_collection.json" \
            --environment "environments/KampusENV.postman_environment.json" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export reports/newman-report.html

      # Подготовка папки с отчётом для публикации на GitHub Pages
      - name: Prepare folder for GitHub Pages
        if: always()
        run: |
          mkdir -p report-dist
          cp reports/newman-report.html report-dist/index.html

      #  Публикация отчёта на GitHub Pages (в ветку gh-pages)
      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: report-dist
          publish_branch: gh-pages

